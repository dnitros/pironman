name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          go build -trimpath -o "dist/pironman-${GOOS}-${GOARCH}" -ldflags "-s -w \
            -X github.com/dnitros/pironman/internal/cli.version=${GITHUB_REF_NAME} \
            -X github.com/dnitros/pironman/internal/selfupdate.Repo=${GITHUB_REPOSITORY}" \
            ./cmd/pironman
          cd dist && sha256sum pironman-* > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
