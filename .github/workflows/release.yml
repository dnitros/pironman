name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X github.com/dnitros/pironman/internal/cli.version=${GITHUB_REF_NAME}" -o pironman-linux-arm64 ./cmd/pironman

      - run: sha256sum pironman-linux-arm64 > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pironman-linux-arm64 checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
